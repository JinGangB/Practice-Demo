<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">看看空元素能否这么用</meta>
        <title>这是元素title，不是属性title</title>
    </head>
    <body>
        <!-- id属性用法:给元素一个唯一的标识符，用于CSS选择器或Javascript操作 -->
            <div id="header">This is header</div>

        <!-- class属性用法:给元素指定一个或多个类名，方便通过CSS或Javascript操作 -->
            <p class="text-muted">This is a paragraph.</p>

        <!-- style属性用法:直接为元素定义CSS样式 -->
            <span style="color: red;">This text is red</span>

        <!-- title属性用法:提供元素的额外信息，通常在鼠标悬停时显示 -->
            <button title="Click me">Submit</button>

        <!-- type属性用法:指定表单元素的类型(如text,password,submit等) -->
            <input/ type="password" name="password">

        <!-- name属性用法:在<input>,<form>,<select>等表单元素中使用，定义元素名称 -->
            <input/ type="text" name="username">

        <!-- value属性用法:定义表单元素的值 -->
            <input/ type="text" value="Default text">

        <!-- href属性用法:用于<a>标签，指定链接目标 -->
            <a href="https://www.example.com">Visit Example</a>

        <!-- target属性用法:用于<a>标签，指定链接打开的方式(如_blank在新窗口中打开) -->
            <a href="https://www.example.com" target="_blank" rel="noopener">Open in new tab</a>
        
        <!-- src属性用法:用于<img>和<script>标签，指定路径。 -->
            <img src="image.jpg" alt="Description">试一下空元素能不能这么用</img>
        
        <!-- alt属性用法:用于<img>标签，提供图片的代替文本。 -->
            <img/ src="logo.png" alt="Company logo">

        <!-- placeholder属性用法:为<inout>和<textarea>提供一个占位符文本 -->
            <input/ type="text" placeholder="Enter your name">
    </body>
</html>
